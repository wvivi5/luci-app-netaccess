name: Build luci-app-netaccess

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup OpenWrt SDK
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Prepare plugin
      run: |
        mkdir -p openwrt/package/luci-app-netaccess
        cp -r * openwrt/package/luci-app-netaccess/
        cd openwrt
        echo -e "CONFIG_PACKAGE_luci-app-netaccess=y" > .config
        make defconfig

    - name: Build package
      run: |
        cd openwrt
        make package/luci-app-netaccess/compile V=s -j$(nproc)

    - name: Upload IPK
      uses: actions/upload-artifact@v3
      with:
        name: luci-app-netaccess-ipk
        path: |
          openwrt/bin/packages/**/luci-app-netaccess_*.ipk
